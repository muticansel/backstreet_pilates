name: Deploy production Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: bash scripts/validate_migrations.sh
      - name: Review pending production migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          supabase db push --db-url "$DATABASE_URL" --dry-run
      - name: Skip development-only demo catalog migration
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          supabase migration repair 20260927000400 --status applied --db-url "$DATABASE_URL"
      - name: Apply reviewed migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: supabase db push --db-url "$DATABASE_URL"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy admin-user-management --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy send-push-notification --project-ref "$SUPABASE_PROJECT_REF"
